[project]
name = "locksmith"
version = "0.1.0"
description = "De novo anti-PD-1 antibody design for the Locksmith Bio x IBAB hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy>=2",
    "biopython>=1.84",
    "biotite>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "requests>=2.32",
    "tqdm>=4.66",
    "anarcii>=2.0.8",
    "freesasa>=2.2.1",
    # Used directly by 7 tracked files including io/pdb.py, submit/package.py and
    # submit/pae.py -- i.e. it is on the validator's own import path. It was undeclared
    # until 2026-09-27 and arrived only as a transitive of `anarcii`; if anarcii ever
    # drops it, `import locksmith.io.pdb` breaks. A core import satisfied by accident.
    "gemmi>=0.6",
    # The pitch deck is a scored deliverable (SS4.4, 50 points) and src/locksmith/submit/deck.py
    # imports this. It was undeclared until 2026-09-25, so `scripts/57` crashed at the deck
    # step on a clean env -- AFTER writing the package files, so the package looked built.
    "python-pptx>=1.0",
]

[project.optional-dependencies]
analysis = ["scikit-learn>=1.5", "matplotlib>=3.9", "scipy>=1.14"]

# `dev` lives in [dependency-groups], NOT [project.optional-dependencies]. `uv sync`
# installs dependency-groups by default and extras only on request, so declaring pytest as
# an extra meant the README's own `uv run pytest tests/` still failed on a clean clone --
# the exact defect the 2026-09-26 comment below claimed to have fixed.
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locksmith"]

# Blackwell (RTX 5070 Ti Laptop, sm_120) needs CUDA >= 12.8.
# The default PyPI torch wheel may be built against an older CUDA and will
# install cleanly then fail at runtime. Pin the index explicitly.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
